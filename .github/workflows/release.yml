name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    # Deliberately GitHub-hosted, not CI_RUNNER: release builds stay off the
    # self-hosted runner (key-isolation boundary, see Logiphys/ci-infra).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build all platforms
        run: make build-all
      - name: Generate checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
